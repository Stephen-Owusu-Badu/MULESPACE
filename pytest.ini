[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    --cov-fail-under=95
# Subset runs: default addopts measure whole app, so fail-under may trip. Example:
#   python3 -m pytest tests/test_auth.py -q --no-cov
